<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master File Uploaded | IAMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <div class="flex h-screen overflow-hidden" 
         x-data="{ 
            currentTab: 'All',
            searchQuery: '',
            files: [
                { name: 'Signed_ANM_001.pdf', folder: 'Audit Notification Memorandum (ANM)', phase: 'Planning', uploader: 'Lyra Zel Bedayo', role: 'Lead Auditor', date: 'Mar 04, 2026', type: 'pdf' },
                { name: 'Example_OrgChart.pdf', folder: 'Inventory of MOVs (IM)', phase: 'Planning', uploader: 'Example Office', role: 'Auditee', date: 'Mar 05, 2026', type: 'pdf' },
                { name: 'Example.docx', folder: 'Inventory of MOVs (IM)', phase: 'Planning', uploader: 'Example Department', role: 'Auditee', date: 'Mar 05, 2026', type: 'doc' },
                { name: 'Draft_AWP_v2.xlsx', folder: 'Audit Work Program (AWP)', phase: 'Planning', uploader: 'Lyra Zel Bedayo', role: 'Assistant Auditor', date: 'Mar 06, 2026', type: 'xls' },
                
                { name: 'Entry_Conference_Minutes.pdf', folder: 'Entry/Exit Conference Notes (ECN)', phase: 'Execution', uploader: 'Aries Domanais', role: 'Team Member', date: 'Mar 10, 2026', type: 'pdf' },
                { name: 'Walkthrough_Example.docx', folder: 'Walkthrough Test Work Paper (WT)', phase: 'Execution', uploader: 'Lyra Zel Bedayo', role: 'Lead Auditor', date: 'Mar 12, 2026', type: 'doc' },
                { name: 'Summary_of_Gaps_v1.xlsx', folder: 'Summary of Gaps (SOG)', phase: 'Execution', uploader: 'Lyra Zel Bedayo', role: 'Assistant Auditor', date: 'Mar 15, 2026', type: 'xls' },
                
                { name: 'Initial_Audit_Report.pdf', folder: 'Internal Audit Report (IAR)', phase: 'Reporting', uploader: 'Lyra Zel Bedao', role: 'Lead Auditor', date: 'Mar 25, 2026', type: 'pdf' },
                { name: 'Survey_Feedback_Responses.xlsx', folder: 'Audit Feedback Survey Form (AFSF)', phase: 'Reporting', uploader: 'Example Office', role: 'Auditee', date: 'Mar 28, 2026', type: 'xls' },
                
                { name: 'Action_Plan_Implementation.docx', folder: 'Action Plan Status (AAPIS)', phase: 'Follow Up', uploader: 'Example Office', role: 'Auditee', date: 'Apr 15, 2026', type: 'doc' }
            ],
            get filteredFiles() {
                return this.files.filter(file => {
                    const matchesTab = this.currentTab === 'All' || file.phase === this.currentTab;
                    const matchesSearch = file.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                                          file.uploader.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                                          file.folder.toLowerCase().includes(this.searchQuery.toLowerCase());
                    return matchesTab && matchesSearch;
                });
            }
         }">
        
        <aside class="w-20 bg-slate-900 flex flex-col items-center py-8 shadow-xl z-20 shrink-0">
            <div class="bg-indigo-500 p-2 rounded-lg text-white mb-8">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04m17.236 0a11.955 11.955 0 00-11.764 0 11.955 11.955 0 01-8.618-3.04m17.236 0A11.956 11.956 0 0112 21.48a11.956 11.956 0 01-8.618-3.04" /></svg>
            </div>
            <img src="https://ui-avatars.com/api/?name=Lyra+Bedayo&background=6366f1&color=fff" class="w-10 h-10 rounded-xl mb-4 border border-slate-700">
            <nav class="flex-1 flex flex-col gap-4 mt-4">
                <a href="/dashboard" class="p-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                </a>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden bg-slate-50">
            
            <header class="bg-white border-b border-slate-200 px-10 py-8 shrink-0 z-10">
                <div class="flex justify-between items-end mb-6">
                    <div>
                        <h1 class="text-2xl font-black text-slate-800 uppercase tracking-tight">Master File</h1>
                        <p class="text-sm font-semibold text-slate-500 mt-1">View all uploaded documents, drafts, and submissions across all phases.</p>
                    </div>
                    
                    <div class="relative w-72">
                        <input type="text" x-model="searchQuery" placeholder="Search files, uploaders..." class="w-full bg-slate-100 border-none rounded-xl pl-10 pr-4 py-2.5 text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 absolute left-4 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    </div>
                </div>

                <div class="flex gap-2">
                    <template x-for="tab in ['All', 'Planning', 'Execution', 'Reporting', 'Follow Up']">
                        <button @click="currentTab = tab" 
                                :class="currentTab === tab ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'"
                                class="px-5 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest transition-colors" x-text="tab"></button>
                    </template>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto custom-scrollbar p-10">
                <div class="max-w-7xl mx-auto bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                    
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 border-b border-slate-200">
                            <tr>
                                <th class="p-5 text-[10px] font-black text-slate-400 uppercase tracking-widest">Document Name</th>
                                <th class="p-5 text-[10px] font-black text-slate-400 uppercase tracking-widest">Classification (Phase & Folder)</th>
                                <th class="p-5 text-[10px] font-black text-slate-400 uppercase tracking-widest">Uploaded By</th>
                                <th class="p-5 text-[10px] font-black text-slate-400 uppercase tracking-widest">Date</th>
                                <th class="p-5 text-[10px] font-black text-slate-400 uppercase tracking-widest text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            
                            <template x-if="filteredFiles.length === 0">
                                <tr>
                                    <td colspan="5" class="p-10 text-center text-slate-400 font-bold text-sm">No documents found matching your criteria.</td>
                                </tr>
                            </template>

                            <template x-for="file in filteredFiles" :key="file.name">
                                <tr class="hover:bg-slate-50/50 transition-colors group">
                                    
                                    <td class="p-5">
                                        <div class="flex items-center gap-3">
                                            <div class="p-2 rounded-lg" 
                                                 :class="file.type === 'pdf' ? 'bg-rose-100 text-rose-600' : (file.type === 'xls' ? 'bg-emerald-100 text-emerald-600' : 'bg-blue-100 text-blue-600')">
                                                <svg x-show="file.type === 'pdf'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
                                                <svg x-show="file.type === 'doc'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                                                <svg x-show="file.type === 'xls'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
                                            </div>
                                            <div>
                                                <p class="text-sm font-bold text-slate-800" x-text="file.name"></p>
                                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5" x-text="(file.type).toUpperCase() + ' Document'"></p>
                                            </div>
                                        </div>
                                    </td>

                                    <td class="p-5">
                                        <div class="flex flex-col items-start gap-1">
                                            <span class="px-2 py-0.5 rounded text-[9px] font-black uppercase tracking-widest border"
                                                  :class="file.phase === 'Planning' ? 'bg-indigo-50 text-indigo-600 border-indigo-200' : 
                                                          file.phase === 'Execution' ? 'bg-emerald-50 text-emerald-600 border-emerald-200' :
                                                          file.phase === 'Reporting' ? 'bg-amber-50 text-amber-600 border-amber-200' :
                                                          'bg-rose-50 text-rose-600 border-rose-200'" x-text="file.phase"></span>
                                            <p class="text-xs font-bold text-slate-600 mt-1" x-text="file.folder"></p>
                                        </div>
                                    </td>

                                    <td class="p-5">
                                        <div class="flex items-center gap-3">
                                            <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-500 font-black text-xs shrink-0"
                                                 x-text="file.uploader.substring(0,2).toUpperCase()"></div>
                                            <div>
                                                <p class="text-sm font-bold text-slate-800 leading-tight" x-text="file.uploader"></p>
                                                <p class="text-[10px] font-bold mt-0.5" 
                                                   :class="file.role === 'Auditee' ? 'text-amber-600' : 'text-indigo-600'" 
                                                   x-text="file.role"></p>
                                            </div>
                                        </div>
                                    </td>

                                    <td class="p-5">
                                        <p class="text-xs font-bold text-slate-500" x-text="file.date"></p>
                                    </td>

                                    <td class="p-5 text-right">
                                        <div class="flex items-center justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <button class="p-2 text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors" title="View Document">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                                            </button>
                                            <button class="p-2 text-slate-400 hover:bg-slate-100 hover:text-slate-600 rounded-lg transition-colors" title="Download">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                                            </button>
                                        </div>
                                    </td>

                                </tr>
                            </template>

                        </tbody>
                    </table>

                </div>
            </div>

        </main>
    </div>

</body>
</html>
