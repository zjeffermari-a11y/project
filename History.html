<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document History | IAMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <div class="flex h-screen overflow-hidden" 
         x-data="{ 
            searchQuery: '',
            selectedDoc: 1,
            documents: [
                { 
                    id: 1, 
                    name: 'Audit Work Program (AWP)', 
                    ref: 'AWP-2026-001', 
                    type: 'Planning',
                    status: 'Approved',
                    color: 'emerald',
                    history: [
                        { step: 'Draft Prepared', user: 'Aries Domanais', role: 'Lead Auditor', date: 'Mar 04, 2026 - 09:15 AM', status: 'Completed', note: 'Initial draft uploaded for review.' },
                        { step: 'Level 1 Review', user: 'Angelbert Tulauan', role: 'OIC-Division Chief', date: 'Mar 05, 2026 - 10:30 AM', status: 'Completed', note: 'Reviewed timelines and resource allocation. Looks good to proceed.' },
                        { step: 'Level 2 Approval', user: 'Mary Rose Vilchez-Mariano', role: 'Director, IAS', date: 'Mar 06, 2026 - 02:45 PM', status: 'Approved', note: 'Final approval granted. Proceed with execution.' }
                    ]
                },
                { 
                    id: 2, 
                    name: 'Audit Notification Memorandum', 
                    ref: 'ANM-2026-004', 
                    type: 'Planning',
                    status: 'Pending L2',
                    color: 'amber',
                    history: [
                        { step: 'Draft Prepared', user: 'Lyra Zel Bedayo', role: 'Asst. Auditor', date: 'Mar 08, 2026 - 11:20 AM', status: 'Completed', note: 'ANM generated for Registrar Office.' },
                        { step: 'Level 1 Review', user: ' Menchie Eusebio', role: 'Lead Auditor', date: 'Mar 09, 2026 - 08:05 AM', status: 'Completed', note: 'Checked dates and objectives. Forwarded to Director.' },
                        { step: 'Level 2 Approval', user: 'Mary Rose Vilchez-Mariano', role: 'Director, IAS', date: 'Pending', status: 'Pending', note: 'Awaiting signature.' }
                    ]
                },
                { 
                    id: 3, 
                    name: 'Inventory of MOVs', 
                    ref: 'IM-2026-002', 
                    type: 'Execution',
                    status: 'Returned (L1)',
                    color: 'rose',
                    history: [
                        { step: 'Document Submitted', user: 'Registrar Office', role: 'Auditee', date: 'Mar 10, 2026 - 03:10 PM', status: 'Completed', note: 'Uploaded initial required documents.' },
                        { step: 'Level 1 Review', user: 'Lyra Zel Bedayo', role: 'Lead Auditor', date: 'Mar 11, 2026 - 09:00 AM', status: 'Returned', note: 'The Organizational Chart provided is outdated (from 2024). Please upload the 2026 version.' },
                        { step: 'Level 2 Approval', user: '-', role: 'Director, IAS', date: '-', status: 'Locked', note: 'Requires L1 clearance first.' }
                    ]
                }
            ],
            get activeDoc() {
                return this.documents.find(d => d.id === this.selectedDoc);
            },
            get filteredDocs() {
                if (this.searchQuery === '') return this.documents;
                return this.documents.filter(doc => doc.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || doc.ref.toLowerCase().includes(this.searchQuery.toLowerCase()));
            }
         }">
        
        <aside class="w-20 bg-slate-900 flex flex-col items-center py-8 shadow-xl z-20 shrink-0">
            <div class="bg-indigo-500 p-2 rounded-lg text-white mb-8 shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04m17.236 0a11.955 11.955 0 00-11.764 0 11.955 11.955 0 01-8.618-3.04m17.236 0A11.956 11.956 0 0112 21.48a11.956 11.956 0 01-8.618-3.04" /></svg>
            </div>
            <nav class="flex-1 flex flex-col gap-4 mt-4 w-full px-4">
                <a href="/dashboard" class="p-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl flex justify-center transition-colors" title="Home">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                </a>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden bg-slate-50">
            
            <header class="bg-white border-b border-slate-200 px-10 py-8 shrink-0 z-10">
                <div class="flex justify-between items-end">
                    <div>
                        <h2 class="text-indigo-600 font-black uppercase tracking-widest text-[10px] mb-1">Audit Trail</h2>
                        <h1 class="text-3xl font-black uppercase tracking-tight text-slate-900">Document History</h1>
                        <p class="text-slate-500 font-medium text-sm mt-1">Track the 2-level review process and lifecycle of all system documents.</p>
                    </div>
                </div>
            </header>

            <div class="flex-1 overflow-hidden flex">
                
                <div class="w-1/3 bg-white border-r border-slate-200 flex flex-col">
                    <div class="p-6 border-b border-slate-100">
                        <div class="relative">
                            <input type="text" x-model="searchQuery" placeholder="Search document or ref no..." class="w-full bg-slate-100 border-none rounded-xl pl-10 pr-4 py-2.5 text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 absolute left-4 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                        </div>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-2">
                        <template x-for="doc in filteredDocs" :key="doc.id">
                            <div @click="selectedDoc = doc.id" 
                                 class="p-4 rounded-2xl cursor-pointer transition-all border"
                                 :class="selectedDoc === doc.id ? 'bg-indigo-50 border-indigo-200 shadow-sm' : 'bg-white border-transparent hover:bg-slate-50 hover:border-slate-200'">
                                <div class="flex justify-between items-start mb-2">
                                    <span class="text-[10px] font-black uppercase tracking-widest text-slate-400" x-text="doc.ref"></span>
                                    <span class="px-2 py-0.5 rounded text-[9px] font-black uppercase tracking-widest border"
                                          :class="'bg-' + doc.color + '-50 text-' + doc.color + '-600 border-' + doc.color + '-200'" 
                                          x-text="doc.status"></span>
                                </div>
                                <h3 class="text-sm font-bold text-slate-800 leading-tight" x-text="doc.name"></h3>
                                <p class="text-[10px] font-bold text-slate-400 mt-1" x-text="doc.type + ' Phase'"></p>
                            </div>
                        </template>
                    </div>
                </div>

                <div class="w-2/3 bg-slate-50 flex flex-col overflow-y-auto custom-scrollbar">
                    
                    <template x-if="activeDoc">
                        <div class="p-10 max-w-3xl mx-auto w-full">
                            
                            <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm mb-10">
                                <div class="flex justify-between items-start mb-4">
                                    <div>
                                        <h2 class="text-2xl font-black text-slate-800 tracking-tight" x-text="activeDoc.name"></h2>
                                        <p class="text-sm font-bold text-slate-500 mt-1" x-text="'Ref: ' + activeDoc.ref"></p>
                                    </div>
                                    <button class="px-4 py-2 bg-indigo-50 text-indigo-600 rounded-xl text-xs font-black uppercase tracking-widest hover:bg-indigo-100 transition-colors flex items-center gap-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                                        View File
                                    </button>
                                </div>
                            </div>

                            <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-8 ml-2">Review History Timeline</h3>
                            
                            <div class="relative border-l-2 border-slate-200 ml-6 space-y-10 pb-10">
                                
                                <template x-for="(item, index) in activeDoc.history" :key="index">
                                    <div class="relative pl-8 group">
                                        
                                        <div class="absolute -left-[11px] top-1 w-5 h-5 rounded-full border-4 border-slate-50 flex items-center justify-center shadow-sm"
                                             :class="item.status === 'Approved' || item.status === 'Completed' ? 'bg-emerald-500' : 
                                                     item.status === 'Returned' ? 'bg-rose-500' : 
                                                     item.status === 'Pending' ? 'bg-amber-400' : 'bg-slate-300'">
                                             <span x-show="item.status === 'Pending'" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                                        </div>

                                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm transition-all group-hover:shadow-md group-hover:border-indigo-200 relative">
                                            
                                            <div class="absolute top-3 -left-2 w-4 h-4 bg-white border-l border-b border-slate-200 transform rotate-45 group-hover:border-indigo-200 transition-colors"></div>

                                            <div class="flex justify-between items-start mb-3">
                                                <div>
                                                    <h4 class="text-sm font-black text-slate-800 uppercase tracking-tight" x-text="item.step"></h4>
                                                    <p class="text-[10px] font-bold text-slate-400 mt-1" x-text="item.date"></p>
                                                </div>
                                                <span class="px-2 py-0.5 rounded text-[9px] font-black uppercase tracking-widest border"
                                                      :class="item.status === 'Approved' || item.status === 'Completed' ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 
                                                              item.status === 'Returned' ? 'bg-rose-50 text-rose-600 border-rose-200' : 
                                                              item.status === 'Pending' ? 'bg-amber-50 text-amber-600 border-amber-200' : 'bg-slate-100 text-slate-500 border-slate-200'" 
                                                      x-text="item.status"></span>
                                            </div>

                                            <div class="flex items-center gap-3 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                                <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-500 font-black text-xs shrink-0"
                                                     x-text="item.user !== '-' ? item.user.substring(0,2).toUpperCase() : '?'"></div>
                                                <div>
                                                    <p class="text-xs font-bold text-slate-800" x-text="item.user"></p>
                                                    <p class="text-[10px] font-bold text-indigo-500 uppercase tracking-widest mt-0.5" x-text="item.role"></p>
                                                </div>
                                            </div>

                                            <div class="text-sm text-slate-600 leading-relaxed font-medium bg-white" x-text="item.note"></div>
                                        </div>
                                    </div>
                                </template>

                            </div>
                        </div>
                    </template>

                </div>
            </div>
        </main>
    </div>

</body>
</html>
