<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOOLS | IAMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <div class="flex h-screen overflow-hidden">
        
        <aside class="w-20 bg-slate-900 flex flex-col items-center py-8 shadow-xl z-20 shrink-0">
            <div class="bg-indigo-500 p-2 rounded-lg text-white mb-8">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04m17.236 0a11.955 11.955 0 00-11.764 0 11.955 11.955 0 01-8.618-3.04m17.236 0A11.956 11.956 0 0112 21.48a11.956 11.956 0 01-8.618-3.04" /></svg>
            </div>
            <img src="https://ui-avatars.com/api/?name=Lyra+Zel+Bedayo&background=6366f1&color=fff" class="w-10 h-10 rounded-xl mb-4 border border-slate-700">
            <nav class="flex-1 flex flex-col gap-4 mt-4">
                <a href="/dashboard" class="p-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                </a>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden bg-slate-50" x-data="{ selectedPhase: null }">
            
            <header class="p-10 pb-0">
                <h1 class="text-3xl font-black text-slate-800 uppercase tracking-tight">TOOLS</h1>
                <p class="text-slate-500 font-medium mt-1">Select a phase to view layered documents and manage signatures.</p>
            </header>

            <div class="flex-1 overflow-y-auto custom-scrollbar p-10">
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 max-w-7xl mb-12">
                    <div @click="selectedPhase = 'planning'" :class="selectedPhase === 'planning' ? 'ring-4 ring-indigo-500 shadow-2xl scale-105' : 'hover:shadow-2xl hover:border-indigo-500'" class="group bg-white p-10 rounded-[2.5rem] border border-slate-200 shadow-sm transition-all duration-300 flex flex-col items-center text-center cursor-pointer">
                        <div class="w-28 h-28 bg-indigo-50 text-indigo-600 rounded-[2rem] flex items-center justify-center mb-6 group-hover:bg-indigo-600 group-hover:text-white transition-all duration-300 shadow-inner" :class="selectedPhase === 'planning' ? 'bg-indigo-600 text-white' : ''">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" /></svg>
                        </div>
                        <h3 class="font-black text-slate-800 uppercase text-sm tracking-widest">Audit Planning</h3>
                    </div>

                    <div @click="selectedPhase = 'execution'" :class="selectedPhase === 'execution' ? 'ring-4 ring-emerald-500 shadow-2xl scale-105' : 'hover:shadow-2xl hover:border-emerald-500'" class="group bg-white p-10 rounded-[2.5rem] border border-slate-200 shadow-sm transition-all duration-300 flex flex-col items-center text-center cursor-pointer">
                        <div class="w-28 h-28 bg-emerald-50 text-emerald-600 rounded-[2rem] flex items-center justify-center mb-6 group-hover:bg-emerald-600 group-hover:text-white transition-all duration-300 shadow-inner" :class="selectedPhase === 'execution' ? 'bg-emerald-600 text-white' : ''">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" /></svg>
                        </div>
                        <h3 class="font-black text-slate-800 uppercase text-sm tracking-widest">Audit Execution</h3>
                    </div>

                    <div @click="selectedPhase = 'reporting'" :class="selectedPhase === 'reporting' ? 'ring-4 ring-amber-500 shadow-2xl scale-105' : 'hover:shadow-2xl hover:border-amber-500'" class="group bg-white p-10 rounded-[2.5rem] border border-slate-200 shadow-sm transition-all duration-300 flex flex-col items-center text-center cursor-pointer">
                        <div class="w-28 h-28 bg-amber-50 text-amber-600 rounded-[2rem] flex items-center justify-center mb-6 group-hover:bg-amber-600 group-hover:text-white transition-all duration-300 shadow-inner" :class="selectedPhase === 'reporting' ? 'bg-amber-600 text-white' : ''">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" /></svg>
                        </div>
                        <h3 class="font-black text-slate-800 uppercase text-sm tracking-widest">Audit Reporting</h3>
                    </div>

                    <div @click="selectedPhase = 'followup'" :class="selectedPhase === 'followup' ? 'ring-4 ring-rose-500 shadow-2xl scale-105' : 'hover:shadow-2xl hover:border-rose-500'" class="group bg-white p-10 rounded-[2.5rem] border border-slate-200 shadow-sm transition-all duration-300 flex flex-col items-center text-center cursor-pointer">
                        <div class="w-28 h-28 bg-rose-50 text-rose-600 rounded-[2rem] flex items-center justify-center mb-6 group-hover:bg-rose-600 group-hover:text-white transition-all duration-300 shadow-inner" :class="selectedPhase === 'followup' ? 'bg-rose-600 text-white' : ''">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" /></svg>
                        </div>
                        <h3 class="font-black text-slate-800 uppercase text-sm tracking-widest">Audit Follow Up</h3>
                    </div>
                </div>

                <div x-show="selectedPhase" x-cloak x-transition.opacity.duration.300ms class="max-w-7xl pb-10">
                    <div class="bg-white rounded-3xl border border-slate-200 shadow-md overflow-hidden">
                        
                        <div class="p-6 border-b border-slate-100 bg-slate-50 flex items-center gap-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z" /></svg>
                            <h2 class="text-sm font-black text-slate-600 uppercase tracking-widest" 
                                x-text="selectedPhase === 'planning' ? 'Audit Planning Documents' : 
                                        selectedPhase === 'execution' ? 'Audit Execution Documents' : 
                                        selectedPhase === 'reporting' ? 'Audit Reporting Documents' : 
                                        'Audit Follow Up Documents'">
                            </h2>
                        </div>

                        <div x-show="selectedPhase === 'planning'" class="p-6">
                            <div class="grid grid-cols-1 gap-5 items-start">
                                <template x-for="doc in [
                                    'Audit Notification Memorandum (ANM)', 'Inventory of MOVs (IM)', 'Audit Area Profile (AAP)', 
                                    'Audit Engagement Plan (AEP)', 'Audit Work Program (AWP)', 'Summary of Audit Team Roles (RR)', 
                                    'Compliance Checklist (CC)', 'Management Audit Checklist', 'Audit Inquiry Memorandum (AIM)'
                                ]">
                                    <div x-data="{ expanded: false }" class="flex flex-col p-5 rounded-xl border border-indigo-100 bg-indigo-50/30 hover:bg-indigo-50 transition-colors group">
                                        <div class="flex items-center justify-between w-full cursor-pointer" @click="expanded = !expanded">
                                            <div class="flex items-center gap-4 pr-2">
                                                <div class="text-indigo-400 group-hover:text-indigo-600"><svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg></div>
                                                <span class="text-lg font-bold text-slate-800" x-text="doc"></span>
                                            </div>
                                            <div class="text-indigo-400 group-hover:text-indigo-700 shrink-0">
                                                <svg x-show="!expanded" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                                                <svg x-show="expanded" x-cloak xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" /></svg>
                                            </div>
                                        </div>
                                        
                                        <div x-show="expanded" x-transition x-cloak class="mt-5 pt-5 border-t border-indigo-100 overflow-x-auto">
                                            <table class="w-full text-left border-collapse min-w-max">
                                                <thead>
                                                    <tr class="text-[10px] uppercase tracking-widest text-slate-400 border-b border-indigo-100">
                                                        <th class="pb-3 font-black">File Version</th>
                                                        <th class="pb-3 font-black pl-3">Prepared By</th>
                                                        <th class="pb-3 font-black pl-3">Signed By</th>
                                                        <th class="pb-3 font-black text-right">Action</th>
                                                    </tr>
                                                </thead>
                                                <tbody class="divide-y divide-indigo-50">
                                                    <tr class="hover:bg-white/60 transition-colors">
                                                        <td class="py-4 flex items-center gap-2">
                                                            <svg class="h-4 w-4 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                                                            <span class="text-xs text-slate-700 font-bold">Draft_v1.docx</span>
                                                        </td>
                                                        <td class="py-4 pl-3 text-xs text-slate-600 font-bold">Lyra Zel Bedayo</td>
                                                        <td class="py-4 pl-3 text-xs text-amber-500 font-bold italic">Pending Review</td>
                                                        <td class="py-4 text-right">
                                                            <button class="text-xs text-indigo-600 font-bold hover:underline">View</button>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>

                                            <button class="mt-5 w-full py-3 bg-white border border-dashed border-indigo-300 rounded-lg text-xs font-black uppercase tracking-widest text-indigo-600 hover:bg-indigo-100 hover:border-indigo-400 transition-colors flex items-center justify-center gap-2">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                                                Add File
                                            </button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div x-show="selectedPhase === 'execution'" class="p-6">
                            <div class="grid grid-cols-1 gap-5 items-start">
                                <template x-for="doc in [
                                    'Notice of Entry/Exit Conference (ECM)', 'Entry/Exit Conference Notes (ECN)', 
                                    'Interim Audit Memorandum (IAM)', 'Interview Notes (IN)', 'Walkthrough Test Work Paper (WT)'
                                ]">
                                    <div x-data="{ expanded: false }" class="flex flex-col p-5 rounded-xl border border-emerald-100 bg-emerald-50/30 hover:bg-emerald-50 transition-colors group">
                                        <div class="flex items-center justify-between w-full cursor-pointer" @click="expanded = !expanded">
                                            <div class="flex items-center gap-4 pr-2">
                                                <div class="text-emerald-400 group-hover:text-emerald-600"><svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg></div>
                                                <span class="text-lg font-bold text-slate-800" x-text="doc"></span>
                                            </div>
                                            <div class="text-emerald-400 group-hover:text-emerald-700 shrink-0">
                                                <svg x-show="!expanded" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                                                <svg x-show="expanded" x-cloak xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" /></svg>
                                            </div>
                                        </div>
                                        
                                        <div x-show="expanded" x-transition x-cloak class="mt-5 pt-5 border-t border-emerald-100 overflow-x-auto">
                                            <table class="w-full text-left border-collapse min-w-max">
                                                <thead>
                                                    <tr class="text-[10px] uppercase tracking-widest text-slate-400 border-b border-emerald-100">
                                                        <th class="pb-3 font-black">File Version</th>
                                                        <th class="pb-3 font-black pl-3">Prepared By</th>
                                                        <th class="pb-3 font-black pl-3">Signed By</th>
                                                        <th class="pb-3 font-black text-right">Action</th>
                                                    </tr>
                                                </thead>
                                                <tbody class="divide-y divide-emerald-50">
                                                    <tr>
                                                        <td colspan="4" class="py-6 text-center text-xs text-slate-400 font-bold italic">No files uploaded yet.</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                            <button class="mt-5 w-full py-3 bg-white border border-dashed border-emerald-300 rounded-lg text-xs font-black uppercase tracking-widest text-emerald-600 hover:bg-emerald-100 hover:border-emerald-500 transition-colors flex items-center justify-center gap-2">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                                                Add File
                                            </button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div x-show="selectedPhase === 'reporting'" class="p-6">
                            <div class="grid grid-cols-1 gap-5 items-start">
                                <template x-for="doc in [
                                    'Internal Audit Report (IAR)', 'Audit Feedback Survey Form (AFSF)', 'Audit Feedback Survey Analysis Report (AFSAR)'
                                ]">
                                    <div x-data="{ expanded: false }" class="flex flex-col p-5 rounded-xl border border-amber-100 bg-amber-50/30 hover:bg-amber-50 transition-colors group">
                                        <div class="flex items-center justify-between w-full cursor-pointer" @click="expanded = !expanded">
                                            <div class="flex items-center gap-4 pr-2">
                                                <div class="text-amber-400 group-hover:text-amber-600"><svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg></div>
                                                <span class="text-lg font-bold text-slate-800" x-text="doc"></span>
                                            </div>
                                            <div class="text-amber-400 group-hover:text-amber-700 shrink-0">
                                                <svg x-show="!expanded" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                                                <svg x-show="expanded" x-cloak xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" /></svg>
                                            </div>
                                        </div>
                                        <div x-show="expanded" x-transition x-cloak class="mt-5 pt-5 border-t border-amber-100 overflow-x-auto">
                                            <table class="w-full text-left border-collapse min-w-max">
                                                <thead>
                                                    <tr class="text-[10px] uppercase tracking-widest text-slate-400 border-b border-amber-100">
                                                        <th class="pb-3 font-black">File Version</th>
                                                        <th class="pb-3 font-black pl-3">Prepared By</th>
                                                        <th class="pb-3 font-black pl-3">Signed By</th>
                                                        <th class="pb-3 font-black text-right">Action</th>
                                                    </tr>
                                                </thead>
                                                <tbody class="divide-y divide-amber-50">
                                                    <tr><td colspan="4" class="py-6 text-center text-xs text-slate-400 font-bold italic">No files uploaded yet.</td></tr>
                                                </tbody>
                                            </table>
                                            <button class="mt-5 w-full py-3 bg-white border border-dashed border-amber-300 rounded-lg text-xs font-black uppercase tracking-widest text-amber-600 hover:bg-amber-100 hover:border-amber-400 transition-colors flex items-center justify-center gap-2">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                                                Add Layered File
                                            </button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div x-show="selectedPhase === 'followup'" class="p-6">
                            <div class="grid grid-cols-1 gap-5 items-start">
                                <template x-for="doc in [
                                    'Action Plan Status (AAPIS)', 'Compliance to Recommendations (IAsCARes)', 
                                    'Internal Audit Follow-up Report (IAFR)', 'Completion Assessment Report (ComARe)'
                                ]">
                                    <div x-data="{ expanded: false }" class="flex flex-col p-5 rounded-xl border border-rose-100 bg-rose-50/30 hover:bg-rose-50 transition-colors group">
                                        <div class="flex items-center justify-between w-full cursor-pointer" @click="expanded = !expanded">
                                            <div class="flex items-center gap-4 pr-2">
                                                <div class="text-rose-400 group-hover:text-rose-600"><svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg></div>
                                                <span class="text-lg font-bold text-slate-800" x-text="doc"></span>
                                            </div>
                                            <div class="text-rose-400 group-hover:text-rose-700 shrink-0">
                                                <svg x-show="!expanded" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                                                <svg x-show="expanded" x-cloak xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" /></svg>
                                            </div>
                                        </div>
                                        <div x-show="expanded" x-transition x-cloak class="mt-5 pt-5 border-t border-rose-100 overflow-x-auto">
                                            <table class="w-full text-left border-collapse min-w-max">
                                                <thead>
                                                    <tr class="text-[10px] uppercase tracking-widest text-slate-400 border-b border-rose-100">
                                                        <th class="pb-3 font-black">File Version</th>
                                                        <th class="pb-3 font-black pl-3">Prepared By</th>
                                                        <th class="pb-3 font-black pl-3">Signed By</th>
                                                        <th class="pb-3 font-black text-right">Action</th>
                                                    </tr>
                                                </thead>
                                                <tbody class="divide-y divide-rose-50">
                                                    <tr><td colspan="4" class="py-6 text-center text-xs text-slate-400 font-bold italic">No files uploaded yet.</td></tr>
                                                </tbody>
                                            </table>
                                            <button class="mt-5 w-full py-3 bg-white border border-dashed border-rose-300 rounded-lg text-xs font-black uppercase tracking-widest text-rose-600 hover:bg-rose-100 hover:border-rose-400 transition-colors flex items-center justify-center gap-2">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                                                Add Layered File
                                            </button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </main>
    </div>

</body>
</html>
